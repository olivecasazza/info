<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
<script type="module">
import init, * as bindings from '/wasm/panel-kit-tui/info-tui-v2.js';
const wasm = await init({ module_or_path: '/wasm/panel-kit-tui/info-tui-v2_bg.wasm' });

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <title>olive casazza — terminal</title>
    <style>
      :root {
        background: #000;
        color: #d1d5db;
        font-family: "Fira Code", "JetBrains Mono", monospace;
        font-size: 14px;
        cursor: default;
      }
      * { box-sizing: border-box; user-select: none; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      #info-tui {
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }
      #info-tui_ratzilla_grid, #grid { width: 100%; height: 100%; }
      pre { margin: 0; padding: 0; border: 0; font-family: inherit; font-size: 1rem; line-height: normal; }
      span { line-height: normal; }
    </style>
  <link rel="modulepreload" href="/wasm/panel-kit-tui/info-tui-v2.js" crossorigin="anonymous" integrity="sha384-ouQoawqP7NpwgtK7mmYb9UHr/0Ag0weouNt7/nO08JR0K/tymYAiKxSGcmF6n7yP"><link rel="preload" href="/wasm/panel-kit-tui/info-tui-v2_bg.wasm" crossorigin="anonymous" integrity="sha384-ESMpv1/vkiU8ct4dmWND0nJO/uSWJvvHLCs/5yxD/EnqNW4fRuqrpzYR+j3krUCv" as="fetch" type="application/wasm"></head>
  <body>
    <main id="info-tui" aria-label="info terminal"></main>
    <script>
      const notifyResize = () => requestAnimationFrame(() => {
        window.dispatchEvent(new Event("resize"));
      });
      window.visualViewport?.addEventListener("resize", notifyResize);
      window.addEventListener("orientationchange", notifyResize);
      window.addEventListener("TrunkApplicationStarted", notifyResize);
      new ResizeObserver(notifyResize).observe(document.body);
    </script>
  </body>
</html>
