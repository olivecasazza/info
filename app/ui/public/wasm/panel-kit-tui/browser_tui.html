<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
<script type="module">
import init, * as bindings from '/wasm/panel-kit-tui/info-tui-v2.js';
const wasm = await init({ module_or_path: '/wasm/panel-kit-tui/info-tui-v2_bg.wasm' });

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <title>olive casazza — terminal</title>
    <style>
      :root {
        background: #000;
        color: #d1d5db;
        font-family: "Fira Code", "JetBrains Mono", monospace;
        font-size: 14px;
        cursor: default;
      }
      * { box-sizing: border-box; user-select: none; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      #info-tui {
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }
      #info-tui canvas { display: block; width: 100%; height: 100%; outline: none; }
    </style>
  <link rel="modulepreload" href="/wasm/panel-kit-tui/info-tui-v2.js" crossorigin="anonymous" integrity="sha384-ozfMHcWpl4mYvLG/31xATb301YWVyZmNmS8OBJHZkZcs0rCBth/us0d8e34dmlks"><link rel="preload" href="/wasm/panel-kit-tui/info-tui-v2_bg.wasm" crossorigin="anonymous" integrity="sha384-CitxizzpUx40yVL//pMcd2xqb2qYKvPkdB+yzW+fa5yBZyZS/wOMT+4GJbjam7SM" as="fetch" type="application/wasm"></head>
  <body>
    <main id="info-tui" aria-label="info terminal"></main>
    <script>
      const notifyResize = () => requestAnimationFrame(() => {
        window.dispatchEvent(new Event("resize"));
      });
      window.visualViewport?.addEventListener("resize", notifyResize);
      window.addEventListener("orientationchange", notifyResize);
      window.addEventListener("TrunkApplicationStarted", notifyResize);
      new ResizeObserver(notifyResize).observe(document.body);
    </script>
  </body>
</html>
